<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>集卡赢大奖 · 原型</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #fff; }
  .stage { position: relative; flex: 1; overflow: hidden; }
  .stage.scrollable { overflow-x: auto; overflow-y: hidden; }
  .stage iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }
  .proto-bar {
    position: fixed; right: 12px; bottom: 12px; z-index: 9;
    display: flex; align-items: center; gap: 8px;
    font: 12px/1 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .proto-bar button, .proto-bar a {
    display: inline-flex; align-items: center; gap: 4px;
    height: 28px; padding: 0 10px; border-radius: 6px; cursor: pointer;
    background: rgba(17, 24, 39, .72); color: #fff; text-decoration: none;
    border: 0; backdrop-filter: blur(4px); font: inherit;
  }
  .proto-bar button:hover, .proto-bar a:hover { background: rgba(17, 24, 39, .88); }
  .proto-hint {
    position: fixed; left: 12px; bottom: 12px; z-index: 9;
    display: none; padding: 4px 8px; border-radius: 6px;
    background: rgba(17, 24, 39, .72); color: #fff;
    font: 11px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .proto-hint.show { display: block; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="proto-hint" id="hint">左右滑动查看，或点右下角「全屏」</div>
<div class="proto-bar">
  <button type="button" id="menu-btn">页面菜单</button>
  <button type="button" id="fs-btn">全屏</button>
  <a href="start.html#g=1&p=%E6%B4%BB%E5%8A%A8%E4%B8%BB%E9%A1%B5%EF%BC%88%E8%BF%9B%E8%A1%8C%E4%B8%AD%EF%BC%89" target="_blank" rel="noopener">新窗口</a>
</div>
<script>
  (function () {
    // 画布宽度：按 1980 的视口宽度铺开
    var DESIGN_W = 1980;
    var MIN_SCALE = 0.5;
    var MAX_SCALE = 1.6;
    var page = "活动主页（进行中）";
    var url = "start.html#g=1&p=" + encodeURIComponent(page);
    var stage = document.getElementById("stage");

    var f = document.createElement("iframe");
    f.src = url;
    f.title = "集卡赢大奖原型";
    f.setAttribute("allowfullscreen", "");
    stage.appendChild(f);

    // Axure 播放器的「页面」侧栏默认展开，会盖住画布左边一块。
    // 这里点一下它自带的折叠按钮（左上角那个），保留原生交互——
    // 之后读者随时可以点左边那个标签把它展开。
    var folded = false;
    function foldSidebar() {
      if (folded) return;
      try {
        var doc = f.contentDocument;
        if (!doc) return;
        var host = doc.getElementById("sitemapHost");
        if (host && getComputedStyle(host).display === "none") { folded = true; return; }
        var btn = doc.getElementById("minimizeArrow");
        if (btn && host) { btn.click(); folded = true; }
      } catch (e) {
        /* 忽略 */
      }
    }
    f.addEventListener("load", function () {
      folded = false;
      foldSidebar();
      setTimeout(foldSidebar, 600);
      setTimeout(foldSidebar, 1800);
    });

    function fit() {
      var w = stage.clientWidth;
      var h = stage.clientHeight;
      var scale = w / DESIGN_W;
      var clamped = false;
      if (scale < MIN_SCALE) { scale = MIN_SCALE; clamped = true; }
      if (scale > MAX_SCALE) { scale = MAX_SCALE; }
      // 逻辑宽度不小于「缩放后正好铺满」的宽度，否则全屏时右侧留白
      var logicalW = Math.max(DESIGN_W, Math.ceil(w / scale));
      f.style.width = logicalW + "px";
      f.style.height = Math.ceil(h / scale) + "px";
      f.style.transform = "scale(" + scale + ")";
      stage.classList.toggle("scrollable", clamped);
      document.getElementById("hint").classList.toggle("show", clamped);
    }

    fit();
    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", fit);

    // 用播放器自带的两个按钮做开合，菜单样式保持 Axure 原生
    var menuBtn = document.getElementById("menu-btn");
    menuBtn.addEventListener("click", function () {
      try {
        var doc = f.contentDocument;
        if (!doc) return;
        var host = doc.getElementById("sitemapHost");
        var open = host && getComputedStyle(host).display !== "none";
        if (open) {
          var min = doc.getElementById("minimizeArrow");
          if (min) min.click();
        } else {
          var max = doc.getElementById("maximizePanel");
          if (max) max.click();
        }
      } catch (e) {
        /* 忽略 */
      }
    });

    var btn = document.getElementById("fs-btn");
    function sync() {
      btn.textContent = document.fullscreenElement ? "退出全屏" : "全屏";
      requestAnimationFrame(fit);
    }
    btn.addEventListener("click", function () {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {
          window.open(url, "_blank");
        });
      } else {
        window.open(url, "_blank");
      }
    });
    document.addEventListener("fullscreenchange", sync);
  })();
</script>
</body>
</html>
