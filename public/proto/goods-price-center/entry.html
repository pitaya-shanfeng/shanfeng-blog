<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>商品与价格中心 · 原型</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #fff; }
  .stage { position: relative; flex: 1; overflow: hidden; }
  .stage.scrollable { overflow-x: auto; overflow-y: hidden; }
  .stage iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }
  .proto-bar {
    position: fixed; right: 12px; bottom: 12px; z-index: 9;
    display: flex; align-items: center; gap: 8px;
    font: 12px/1 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .proto-bar select, .proto-bar button, .proto-bar a {
    display: inline-flex; align-items: center; gap: 4px;
    height: 28px; padding: 0 10px; border-radius: 6px; cursor: pointer;
    background: rgba(17, 24, 39, .72); color: #fff; text-decoration: none;
    border: 0; backdrop-filter: blur(4px); font: inherit;
  }
  .proto-bar select { max-width: 220px; }
  .proto-bar select option { color: #111; }
  .proto-bar button:hover, .proto-bar a:hover, .proto-bar select:hover { background: rgba(17, 24, 39, .88); }
  .proto-hint {
    position: fixed; left: 12px; bottom: 12px; z-index: 9;
    display: none; padding: 4px 8px; border-radius: 6px;
    background: rgba(17, 24, 39, .72); color: #fff;
    font: 11px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .proto-hint.show { display: block; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="proto-hint" id="hint">左右滑动查看，或点右下角「全屏」</div>
<div class="proto-bar">
  <select id="page-select" title="切换页面"></select>
  <button type="button" id="fs-btn">全屏</button>
  <a id="open-link" target="_blank" rel="noopener">新窗口</a>
</div>
<script>
  (function () {
    // 画布宽度：桌面原型取 1700（显示主体，注解靠横向拖动）；
    // 移动端取 1040（一屏放得下两台手机 + 中间留白）
    var DESIGN_W = 1700;
    var MIN_SCALE = 0.5;
    var MAX_SCALE = 1.6;
    var PAGES = ["版本说明.html", "功能说明.html", "影响说明.html", "项目说明.html", "设计思路.html", "前台类目.html", "后台类目.html", "三方类目.html", "设计思路_1.html", "平台属性.html", "三方属性.html", "设计思路_2.html", "模版管理.html", "模版详情.html", "设计思路_3.html", "货品档案.html", "货品详情.html", "商品档案.html", "商品详情.html", "项目说明_1.html", "成本管理.html", "碎屏服务.html", "溢价金.html", "押金.html", "保证金.html", "平台售卖.html", "售卖详情（基础）.html", "售卖详情（零售）.html", "售卖详情（租赁）.html", "售卖详情（赊销）.html"];      // Axure 站点树顺序
    var DEFAULT = "商品档案.html";
    var stage = document.getElementById("stage");

    var f = document.createElement("iframe");
    f.title = "商品与价格中心原型";
    f.setAttribute("allowfullscreen", "");
    stage.appendChild(f);

    function urlOf(name) { return encodeURIComponent(name); }

    function show(name) {
      f.src = urlOf(name);
      document.getElementById("open-link").href = urlOf(name);
    }

    var sel = document.getElementById("page-select");
    PAGES.forEach(function (p) {
      var o = document.createElement("option");
      o.value = p; o.textContent = p.replace(/\.html$/, "");
      sel.appendChild(o);
    });
    sel.value = DEFAULT;
    sel.addEventListener("change", function () { show(sel.value); });
    show(DEFAULT);

    function fit() {
      var w = stage.clientWidth;
      var h = stage.clientHeight;
      var scale = w / DESIGN_W;
      var clamped = false;
      if (scale < MIN_SCALE) { scale = MIN_SCALE; clamped = true; }
      if (scale > MAX_SCALE) { scale = MAX_SCALE; }
      // 逻辑宽度不小于「缩放后正好铺满」的宽度，否则全屏时右侧留白
      var logicalW = Math.max(DESIGN_W, Math.ceil(w / scale));
      f.style.width = logicalW + "px";
      f.style.height = Math.ceil(h / scale) + "px";
      f.style.transform = "scale(" + scale + ")";
      stage.classList.toggle("scrollable", clamped);
      document.getElementById("hint").classList.toggle("show", clamped);
    }

    fit();
    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", fit);

    var btn = document.getElementById("fs-btn");
    function sync() {
      btn.textContent = document.fullscreenElement ? "退出全屏" : "全屏";
      requestAnimationFrame(fit);
    }
    btn.addEventListener("click", function () {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {
          window.open(urlOf(sel.value), "_blank");
        });
      } else {
        window.open(urlOf(sel.value), "_blank");
      }
    });
    document.addEventListener("fullscreenchange", sync);
  })();
</script>
</body>
</html>
