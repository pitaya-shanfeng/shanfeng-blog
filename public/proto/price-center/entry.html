<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>价格中心 · 原型</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #fff; }
  .stage { position: relative; flex: 1; overflow: hidden; }
  .stage.scrollable { overflow-x: auto; overflow-y: hidden; }
  .stage iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }

  /* 页面菜单：仿 Axure 播放器左侧的页面树 */
  .page-panel {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 20;
    width: 248px; display: flex; flex-direction: column;
    background: #fff; border-right: 1px solid rgba(0, 0, 0, .12);
    box-shadow: 0 8px 28px rgba(15, 23, 42, .16);
    transform: translateX(-100%); transition: transform .18s ease;
    font: 12px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .page-panel.open { transform: translateX(0); }
  .page-panel-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid rgba(0, 0, 0, .08);
    font-weight: 600; color: #111827;
  }
  .page-panel-head .close {
    margin-left: auto; border: 0; background: transparent; cursor: pointer;
    font-size: 16px; line-height: 1; color: #6b7280; padding: 2px 4px;
  }
  .page-search {
    margin: 8px 12px; padding: 5px 8px; border: 1px solid rgba(0, 0, 0, .14);
    border-radius: 5px; font: inherit; outline: none; color: #111827;
  }
  .page-list { overflow: auto; padding: 4px 0 12px; flex: 1; }
  .page-item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    padding: 4px 12px 4px 20px; border: 0; background: transparent;
    color: #374151; font: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .page-item:hover { background: rgba(59, 130, 246, .10); }
  .page-item.active { background: rgba(59, 130, 246, .16); color: #1d4ed8; font-weight: 600; }
  .page-empty { padding: 8px 20px; color: #9ca3af; }

  .proto-bar {
    position: fixed; right: 12px; bottom: 12px; z-index: 9;
    display: flex; align-items: center; gap: 8px;
    font: 12px/1 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .proto-bar button, .proto-bar a {
    display: inline-flex; align-items: center; gap: 4px;
    height: 28px; padding: 0 10px; border-radius: 6px; cursor: pointer;
    background: rgba(17, 24, 39, .72); color: #fff; text-decoration: none;
    border: 0; backdrop-filter: blur(4px); font: inherit;
  }
  .proto-bar button:hover, .proto-bar a:hover { background: rgba(17, 24, 39, .88); }
  .proto-hint {
    position: fixed; left: 12px; bottom: 12px; z-index: 9;
    display: none; padding: 4px 8px; border-radius: 6px;
    background: rgba(17, 24, 39, .72); color: #fff;
    font: 11px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .proto-hint.show { display: block; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<aside class="page-panel" id="page-panel">
  <div class="page-panel-head">
    <span>页面</span>
    <button class="close" id="panel-close" type="button" aria-label="关闭">×</button>
  </div>
  <input class="page-search" id="page-search" type="search" placeholder="搜索页面" />
  <div class="page-list" id="page-list"></div>
</aside>

<div class="proto-hint" id="hint">左右滑动查看，或点右下角「全屏」</div>
<div class="proto-bar">
  <button type="button" id="pages-btn">页面</button>
  <button type="button" id="fs-btn">全屏</button>
  <a id="open-link" target="_blank" rel="noopener">新窗口</a>
</div>
<script>
  (function () {
    // 画布宽度：统一按 1980 的视口宽度来（用户要求先看这个效果）
    var DESIGN_W = 1980;
    var MIN_SCALE = 0.5;
    var MAX_SCALE = 1.6;
    var PAGES = ["版本说明.html", "项目说明.html", "功能清单.html", "数据采集.html", "数据清洗.html", "市场监控.html", "竞品对比.html", "竞对管理.html"];
    var DEFAULT = "市场监控.html";
    var stage = document.getElementById("stage");
    var panel = document.getElementById("page-panel");
    var listEl = document.getElementById("page-list");
    var searchEl = document.getElementById("page-search");
    var current = DEFAULT;

    var f = document.createElement("iframe");
    f.title = "价格中心原型";
    f.setAttribute("allowfullscreen", "");
    stage.appendChild(f);

    function show(name) {
      current = name;
      f.src = encodeURIComponent(name);
      document.getElementById("open-link").href = encodeURIComponent(name);
      Array.prototype.forEach.call(listEl.children, function (el) {
        if (el.dataset && el.dataset.page === name) el.classList.add("active");
        else if (el.classList) el.classList.remove("active");
      });
      var active = listEl.querySelector(".page-item.active");
      if (active && active.scrollIntoView) active.scrollIntoView({ block: "nearest" });
    }

    function render(keyword) {
      var k = (keyword || "").trim().toLowerCase();
      listEl.textContent = "";
      var shown = 0;
      PAGES.forEach(function (p) {
        var label = p.replace(/\.html$/, "");
        if (k && label.toLowerCase().indexOf(k) < 0) return;
        shown++;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "page-item" + (label + ".html" === current ? " active" : "");
        b.textContent = label;
        b.dataset.page = p;
        b.addEventListener("click", function () { show(p); });
        listEl.appendChild(b);
      });
      if (!shown) {
        var d = document.createElement("div");
        d.className = "page-empty";
        d.textContent = "没有匹配的页面";
        listEl.appendChild(d);
      }
    }

    function togglePanel(open) {
      panel.classList.toggle("open", open);
      if (open) { searchEl.value = ""; render(""); searchEl.focus(); }
    }

    document.getElementById("pages-btn").addEventListener("click", function () {
      togglePanel(!panel.classList.contains("open"));
    });
    document.getElementById("panel-close").addEventListener("click", function () { togglePanel(false); });
    searchEl.addEventListener("input", function () { render(searchEl.value); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") togglePanel(false);
    });

    render("");
    show(DEFAULT);

    function fit() {
      var w = stage.clientWidth;
      var h = stage.clientHeight;
      var scale = w / DESIGN_W;
      var clamped = false;
      if (scale < MIN_SCALE) { scale = MIN_SCALE; clamped = true; }
      if (scale > MAX_SCALE) { scale = MAX_SCALE; }
      var logicalW = Math.max(DESIGN_W, Math.ceil(w / scale));
      f.style.width = logicalW + "px";
      f.style.height = Math.ceil(h / scale) + "px";
      f.style.transform = "scale(" + scale + ")";
      stage.classList.toggle("scrollable", clamped);
      document.getElementById("hint").classList.toggle("show", clamped);
    }

    fit();
    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", fit);

    var btn = document.getElementById("fs-btn");
    function sync() {
      btn.textContent = document.fullscreenElement ? "退出全屏" : "全屏";
      requestAnimationFrame(fit);
    }
    btn.addEventListener("click", function () {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {
          window.open(encodeURIComponent(current), "_blank");
        });
      } else {
        window.open(encodeURIComponent(current), "_blank");
      }
    });
    document.addEventListener("fullscreenchange", sync);
  })();
</script>
</body>
</html>
