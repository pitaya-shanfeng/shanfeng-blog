# 山风 Blog · 腾讯云轻量服务器 Nginx 配置
# 放 /etc/nginx/conf.d/shanfeng.conf，证书用 certbot 申请后替换下面两行路径

server {
    listen 80;
    listen [::]:80;
    server_name shanfengpm.com www.shanfengpm.com;

    # 证书未就绪时先全量跳 https；certbot 申请时可临时注释
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://shanfengpm.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.shanfengpm.com;

    ssl_certificate     /etc/letsencrypt/live/shanfengpm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shanfengpm.com/privkey.pem;

    return 301 https://shanfengpm.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shanfengpm.com;

    root /var/www/shanfeng;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/shanfengpm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shanfengpm.com/privkey.pem;

    # 静态站：先找精确文件、再找目录、最后回落 404
    location / {
        # 找不到就是 404（状态码要对），但要展示自定义 404 页
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 带指纹的构建资源，长缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # og 图、rss 这类少量更新
    location ~* \.(png|jpe?g|webp|svg|ico|xml|txt)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 站点根路径下的 html 短缓存，方便发版后立刻生效
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300";
    }
}
