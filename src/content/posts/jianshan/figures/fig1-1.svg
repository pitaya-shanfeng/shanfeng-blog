<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" width="680" height="236" role="img" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <title>图 1-1　三种惯性的来源</title>
  <desc>政治任务型惯性来自外部期待，架构自嗨型惯性来自内部专业，组织惯性来自组织评价。</desc>
  <defs>
    <marker id="f11ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="186" height="176" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="133" y="70" font-size="12.5" fill="#B45309" text-anchor="middle">外部期待</text>
  <path d="M133 84 L133 98" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f11ar)"/>
  <text x="133" y="124" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle">政治任务型惯性</text>
  <text x="133" y="156" font-size="11.5" fill="#4B5563" text-anchor="middle">当「必须做」替代了</text>
  <text x="133" y="176" font-size="11.5" fill="#4B5563" text-anchor="middle">「为什么做」</text>

  <rect x="246" y="40" width="186" height="176" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="339" y="70" font-size="12.5" fill="#B45309" text-anchor="middle">内部专业</text>
  <path d="M339 84 L339 98" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f11ar)"/>
  <text x="339" y="124" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle">架构自嗨型惯性</text>
  <text x="339" y="156" font-size="11.5" fill="#4B5563" text-anchor="middle">当专业能力</text>
  <text x="339" y="176" font-size="11.5" fill="#4B5563" text-anchor="middle">成为认知牢笼</text>

  <rect x="452" y="40" width="186" height="176" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="545" y="70" font-size="12.5" fill="#B45309" text-anchor="middle">组织评价</text>
  <path d="M545 84 L545 98" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f11ar)"/>
  <text x="545" y="124" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle">组织惯性</text>
  <text x="545" y="156" font-size="11.5" fill="#4B5563" text-anchor="middle">当「做功能」成为</text>
  <text x="545" y="176" font-size="11.5" fill="#4B5563" text-anchor="middle">唯一的价值证明</text>
</svg>
