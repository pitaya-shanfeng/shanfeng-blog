<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 13-1　四类能力怎样组合成一个玩法</title>
  <desc>红包雨模板只保留页面基本结构、红包下落和点击方式、开奖动作，任务和奖池从外部绑定进来：同一个模板可以接分享任务，也可以接助力任务，可以使用普通奖池，也可以在特定条件下进入更高价值的奖池。规则再把这几类能力串起来，表达谁完成了什么、接下来获得什么。</desc>
  <defs>
    <marker id="f131a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="300" fill="#ffffff"/>
  <rect x="170" y="24" width="340" height="76" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="340" y="50" text-anchor="middle" font-size="13" fill="#374151">红包雨模板</text>
  <text x="340" y="78" text-anchor="middle" font-size="10" fill="#6B7280">页面基本结构、红包下落和点击方式、开奖动作</text>
  <path d="M340 100 V126 H180 V140" stroke="#B45309" stroke-width="1.4" fill="none" marker-end="url(#f131a)"/>
  <path d="M340 126 H500 V140" stroke="#B45309" stroke-width="1.4" fill="none" marker-end="url(#f131a)"/>
  <text x="352" y="122" font-size="10" fill="#B45309">从外部绑定</text>
  <rect x="60" y="144" width="240" height="76" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="180" y="170" text-anchor="middle" font-size="12.5" fill="#374151">任务</text>
  <text x="132" y="196" text-anchor="middle" font-size="11" fill="#6B7280">分享任务</text>
  <text x="232" y="196" text-anchor="middle" font-size="11" fill="#6B7280">助力任务</text>
  <rect x="380" y="144" width="240" height="76" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="500" y="170" text-anchor="middle" font-size="12.5" fill="#374151">奖池</text>
  <text x="452" y="196" text-anchor="middle" font-size="11" fill="#6B7280">普通奖池</text>
  <text x="552" y="196" text-anchor="middle" font-size="11" fill="#6B7280">更高价值的奖池</text>
  <path d="M180 220 V242 H340 V254" stroke="#B45309" stroke-width="1.4" fill="none" marker-end="url(#f131a)"/>
  <path d="M500 220 V242 H340" stroke="#B45309" stroke-width="1.4" fill="none"/>
  <rect x="200" y="258" width="280" height="30" rx="9" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="224" y="278" font-size="11" fill="#374151">规则</text>
  <text x="264" y="278" font-size="11" fill="#6B7280">谁完成了什么，接下来获得什么</text>
</svg>
