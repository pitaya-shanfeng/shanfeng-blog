<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 21-2　标明前提：判断也分快慢</title>
  <desc>判断分快慢两类，看它随时间往哪走。快的一类靠打法、平台机制、工具熟练度和行情红利，今天最管用，随后一路衰减；慢的一类是对人与业务的理解，今天不显眼，放几年还在用，甚至会越用越准。分清两类就两步：一句话试出来，一类越用越清楚它的边界在哪，一类越用越觉得自己什么都能做；再给手上的东西标个期限，换个环境它还在不在。</desc>
  <rect width="680" height="300" fill="#ffffff"/>

  <text x="40" y="26" font-size="12.5" fill="#6B7280">快的一类</text>
  <text x="330" y="26" text-anchor="end" font-size="11" fill="#9CA3AF">今天还管用吗</text>
  <line x1="58" y1="44" x2="58" y2="164" stroke="#D1D5DB" stroke-width="1.2"/>
  <line x1="58" y1="164" x2="316" y2="164" stroke="#D1D5DB" stroke-width="1.2"/>
  <path d="M58 56 C130 66 190 106 244 138 C276 156 298 161 316 163" fill="none" stroke="#9CA3AF" stroke-width="2.6"/>
  <text x="187" y="182" text-anchor="middle" font-size="11" fill="#9CA3AF">时间 →</text>
  <text x="40" y="204" font-size="11" fill="#6B7280">打法 · 平台机制 · 工具熟练度 · 红利</text>
  <text x="40" y="226" font-size="11" fill="#9CA3AF">越用越觉得自己什么都能做</text>

  <line x1="340" y1="44" x2="340" y2="164" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="350" y="26" font-size="12.5" fill="#B45309">慢的一类</text>
  <text x="640" y="26" text-anchor="end" font-size="11" fill="#B45309">越用越准吗</text>
  <line x1="368" y1="164" x2="368" y2="44" stroke="#D1D5DB" stroke-width="1.2"/>
  <line x1="368" y1="164" x2="626" y2="164" stroke="#D1D5DB" stroke-width="1.2"/>
  <path d="M368 162 C410 150 460 116 512 84 C560 56 596 48 626 44" fill="none" stroke="#B45309" stroke-width="2.6"/>
  <text x="497" y="182" text-anchor="middle" font-size="11" fill="#B45309">时间 →</text>
  <text x="350" y="204" font-size="11" fill="#B45309">对人与业务的理解</text>
  <text x="350" y="226" font-size="11" fill="#B45309">越用越清楚它的边界在哪</text>

  <rect x="40" y="248" width="600" height="26" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="265" text-anchor="middle" font-size="11.5" fill="#6B7280">标个期限：换公司、换业务、换老板，它还在不在</text>
</svg>
