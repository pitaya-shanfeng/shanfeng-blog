<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 368" width="680" height="368" role="img" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <title>图 2-2　产品价值的五层递进</title>
  <desc>有用、好用、好看、好玩、超值，是从方向到依赖的五层。每一层都立在下面那一层之上，箭头自下而上，越往上越依赖下层。最常被跳过的，就是最底下这一层。</desc>
  <defs>
    <marker id="f22ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M64 330 L64 56" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f22ar)"/>
  <text x="64" y="44" font-size="11" fill="#6B7280" text-anchor="middle">依赖</text>
  <text x="64" y="346" font-size="11" fill="#6B7280" text-anchor="middle">方向</text>

  <rect x="104" y="56" width="396" height="42" rx="8" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="302" y="77" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">超值</text>

  <rect x="104" y="114" width="396" height="42" rx="8" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="302" y="135" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">好玩</text>

  <rect x="104" y="172" width="396" height="42" rx="8" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="302" y="193" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">好看</text>

  <rect x="104" y="230" width="396" height="42" rx="8" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="302" y="251" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">好用</text>

  <rect x="104" y="288" width="396" height="42" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
  <text x="302" y="309" font-size="14" font-weight="500" fill="#B45309" text-anchor="middle" dominant-baseline="central">有用</text>

  <path d="M302 114 L302 100" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f22ar)"/>
  <path d="M302 172 L302 158" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f22ar)"/>
  <path d="M302 230 L302 216" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f22ar)"/>
  <path d="M302 288 L302 274" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f22ar)"/>

  <path d="M500 311 L516 311" fill="none" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="520" y="302" font-size="11" fill="#B45309">最常被跳过的</text>
  <text x="520" y="320" font-size="11" fill="#B45309">就是最底下这一层</text>
</svg>
