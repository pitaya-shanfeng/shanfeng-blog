<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 208" width="680" height="208" role="img" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <title>图 11-1　四个阶段之间传递的是资格，不是时间</title>
  <desc>四个阶段依次是流量与交易、成交转化、服务深化、用户关系。相邻两个阶段之间横着一段事实：真实的访问与交易行为、支付和到店瓶颈得到改善、门店服务贡献获得验证。前一步拿不到这段事实，后一步即使做了也无法说明价值，也就拿不到资源。</desc>
  <defs>
    <marker id="f111a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="f111g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M120 106 L120 164 L240 164 L240 108" fill="none" stroke="#B45309" stroke-width="1.4" marker-end="url(#f111a)"/>
  <path d="M280 106 L280 164 L400 164 L400 108" fill="none" stroke="#B45309" stroke-width="1.4" marker-end="url(#f111a)"/>
  <path d="M440 106 L440 164 L560 164 L560 108" fill="none" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#f111g)"/>

  <rect x="38" y="26" width="124" height="80" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="100" y="56" font-size="10.5" fill="#9CA3AF" text-anchor="middle">第一阶段</text>
  <text x="100" y="82" font-size="15" fill="#374151" text-anchor="middle">流量与交易</text>

  <rect x="198" y="26" width="124" height="80" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="260" y="56" font-size="10.5" fill="#9CA3AF" text-anchor="middle">第二阶段</text>
  <text x="260" y="82" font-size="15" fill="#374151" text-anchor="middle">成交转化</text>

  <rect x="358" y="26" width="124" height="80" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="420" y="56" font-size="10.5" fill="#9CA3AF" text-anchor="middle">第三阶段</text>
  <text x="420" y="82" font-size="15" fill="#374151" text-anchor="middle">服务深化</text>

  <rect x="518" y="26" width="124" height="80" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="580" y="56" font-size="10.5" fill="#9CA3AF" text-anchor="middle">第四阶段</text>
  <text x="580" y="82" font-size="15" fill="#6B7280" text-anchor="middle">用户关系</text>



  <rect x="114" y="138" width="132" height="52" rx="9" fill="#FFF7ED" stroke="#B45309" stroke-width="1"/>
  <text x="180" y="168" font-size="10" fill="#92400E" text-anchor="middle">真实的访问与交易行为</text>
  <rect x="274" y="138" width="132" height="52" rx="9" fill="#FFF7ED" stroke="#B45309" stroke-width="1"/>
  <text x="340" y="168" font-size="10" fill="#92400E" text-anchor="middle">支付和到店瓶颈得到改善</text>
  <rect x="434" y="138" width="132" height="52" rx="9" fill="#FFF7ED" stroke="#B45309" stroke-width="1"/>
  <text x="500" y="157" font-size="10" fill="#92400E" text-anchor="middle">门店服务贡献和</text>
  <text x="500" y="175" font-size="10" fill="#92400E" text-anchor="middle">合作价值获得验证</text>
</svg>
