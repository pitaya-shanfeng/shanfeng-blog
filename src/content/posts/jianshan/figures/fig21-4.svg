<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 21-4　决定去留：停和加注看起来是同一件事</title>
  <desc>一件事做得不顺，可能是方向错了该止损，也可能是还没到时候该加注。把当初决定做这件事的理由拿出来重新念一遍：理由今天依然成立、中间的下滑只是过程，就加注；理由已经变了、剩下的只是舍不得，就停。判断的依据是这件事还值不值得，不是我已经付出了多少。</desc>
  <rect width="680" height="300" fill="#ffffff"/>

  <rect x="40" y="26" width="600" height="34" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="47" text-anchor="middle" font-size="12.5" fill="#374151">同一堆事实：做得不顺</text>

  <path d="M200 60 L180 92" fill="none" stroke="#9CA3AF" stroke-width="1.4"/>
  <path d="M200 60 L500 92" fill="none" stroke="#9CA3AF" stroke-width="1.4"/>
  <text x="140" y="82" font-size="11" fill="#9CA3AF">一种解释</text>
  <text x="540" y="82" font-size="11" fill="#9CA3AF">另一种解释</text>

  <rect x="40" y="94" width="270" height="76" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1"/>
  <text x="175" y="118" text-anchor="middle" font-size="12.5" fill="#B45309">还没到时候，该加注</text>
  <text x="175" y="142" text-anchor="middle" font-size="11" fill="#6B7280">当初的理由今天依然成立</text>
  <text x="175" y="160" text-anchor="middle" font-size="11" fill="#6B7280">下滑只是过程</text>

  <rect x="370" y="94" width="270" height="76" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="505" y="118" text-anchor="middle" font-size="12.5" fill="#374151">方向错了，该停</text>
  <text x="505" y="142" text-anchor="middle" font-size="11" fill="#6B7280">当初的理由已经变了</text>
  <text x="505" y="160" text-anchor="middle" font-size="11" fill="#6B7280">剩下的只是舍不得</text>

  <line x1="340" y1="26" x2="340" y2="170" stroke="#D1D5DB" stroke-width="1.2" stroke-dasharray="4 4"/>

  <rect x="40" y="188" width="600" height="26" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="205" text-anchor="middle" font-size="11.5" fill="#6B7280">检验的办法只有一个：把当初决定做这件事的理由拿出来，重新念一遍</text>

  <rect x="40" y="228" width="600" height="26" rx="6" fill="#FFFBEB" stroke="#B45309" stroke-width="1"/>
  <text x="340" y="245" text-anchor="middle" font-size="11.5" fill="#B45309">看的是理由本身有没有变，不是自己说话的口气变得更坚定了还是更松了</text>

  <text x="340" y="278" text-anchor="middle" font-size="11.5" fill="#9CA3AF">依据是这件事还值不值得，不是我已经付出了多少</text>
</svg>
