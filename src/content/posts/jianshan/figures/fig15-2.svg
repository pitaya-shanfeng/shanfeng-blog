<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 246" width="680" height="246" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 15-2　先验证哪一个关键前提</title>
  <desc>三种情况各有一条该先看清的前提，以及顺序颠倒时会白付什么。用户根本不愿意在原有服务之外继续使用时，要先看清还有没有独立需求，否则白付的是过早建设的完整交付；需求已经明确时，要先看清最大的未知是履约成本，否则再多做页面测试也换不回认识；收入依赖多方参与时，要先看清商家或内容方能否持续供给，否则得到的增长同样很脆弱。</desc>
  <defs>
    <marker id="f15b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="246" fill="#ffffff"/>

  <text x="252" y="22" font-size="10.5" fill="#B45309">关键前提</text>
  <text x="466" y="22" font-size="10.5" fill="#9CA3AF">后面的投入大多会失去意义</text>

  <rect x="20" y="36" width="200" height="46" rx="9" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="34" y="57" font-size="11.5" fill="#6B7280">用户根本不愿意</text>
  <text x="34" y="74" font-size="11.5" fill="#6B7280">在原有服务之外继续使用</text>
  <rect x="252" y="36" width="182" height="46" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
  <text x="266" y="63" font-size="11.5" fill="#B45309">还有没有独立需求</text>
  <rect x="466" y="36" width="194" height="46" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="482" y="63" font-size="11.5" fill="#9CA3AF">过早建设完整交付</text>

  <rect x="20" y="106" width="200" height="46" rx="9" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="34" y="133" font-size="11.5" fill="#6B7280">需求已经明确</text>
  <rect x="252" y="106" width="182" height="46" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
  <text x="266" y="133" font-size="11.5" fill="#B45309">最大的未知是履约成本</text>
  <rect x="466" y="106" width="194" height="46" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="482" y="133" font-size="11.5" fill="#9CA3AF">更多页面测试</text>

  <rect x="20" y="176" width="200" height="46" rx="9" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="34" y="203" font-size="11.5" fill="#6B7280">收入依赖多方参与</text>
  <rect x="252" y="176" width="182" height="46" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
  <text x="266" y="203" font-size="11.5" fill="#B45309">商家或内容方能否持续供给</text>
  <rect x="466" y="176" width="194" height="46" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="482" y="203" font-size="11.5" fill="#9CA3AF">增长同样很脆弱</text>

  <path d="M222 59 H248" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f15b)"/>
  <path d="M436 59 H462" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f15b)"/>
  <path d="M222 129 H248" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f15b)"/>
  <path d="M436 129 H462" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f15b)"/>
  <path d="M222 199 H248" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f15b)"/>
  <path d="M436 199 H462" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f15b)"/>
</svg>
