<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 264" width="680" height="264" role="img" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <title>图 3-2　需求池的三状态流转</title>
  <desc>线索、问题、需求依次判断，每一步都要重新判断一次边界；问题未被定义清楚的停在「线索」，不是我们的需求停在「问题」，没有退出条件的停在「需求」；这三类都不进入优先级排序，而不是排到后面。</desc>
  <defs>
    <marker id="f32ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="16" y="68" width="72" height="52" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="52" y="94" font-size="11" fill="#6B7280" text-anchor="middle" dominant-baseline="central">所有声音</text>

  <path d="M88 94 L116 94" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f32ar)"/>

  <rect x="120" y="68" width="96" height="52" rx="8" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="168" y="94" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">线索</text>

  <path d="M216 94 L260 94" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f32ar)"/>

  <rect x="264" y="68" width="96" height="52" rx="8" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="312" y="94" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">问题</text>

  <path d="M360 94 L404 94" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f32ar)"/>

  <rect x="408" y="68" width="96" height="52" rx="8" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="456" y="94" font-size="14" font-weight="500" fill="#1F2937" text-anchor="middle" dominant-baseline="central">需求</text>

  <path d="M504 94 L548 94" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f32ar)"/>

  <rect x="552" y="68" width="112" height="52" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="608" y="94" font-size="13" fill="#374151" text-anchor="middle" dominant-baseline="central">优先级排序</text>

  <path d="M168 120 L168 144" fill="none" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#f32ar)"/>
  <path d="M312 120 L312 144" fill="none" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#f32ar)"/>
  <path d="M456 120 L456 144" fill="none" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#f32ar)"/>

  <rect x="98" y="150" width="428" height="92" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>

  <rect x="114" y="166" width="108" height="36" rx="8" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="168" y="184" font-size="12" fill="#1F2937" text-anchor="middle" dominant-baseline="central">未被定义清楚</text>

  <rect x="258" y="166" width="108" height="36" rx="8" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="312" y="184" font-size="12" fill="#1F2937" text-anchor="middle" dominant-baseline="central">不是我们的需求</text>

  <rect x="402" y="166" width="108" height="36" rx="8" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="456" y="184" font-size="12" fill="#1F2937" text-anchor="middle" dominant-baseline="central">没有退出条件</text>

  <text x="312" y="221" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="central">都不进入优先级排序</text>
</svg>
