<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" width="680" height="150" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 12-3　看见架构的五个动作</title>
  <desc>从业务现场里看见角色和动作，从交接物里发现反复出现的东西，从异常和变化里看见对象之间隐藏的关系，再从不同需求里找到那些不会随着一次项目结束而消失的业务对象，最后让对象、关系、规则和责任进入系统。</desc>
  <defs>
    <marker id="f123a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="150" fill="#ffffff"/>
  <rect x="16" y="30" width="116" height="78" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="74" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF">业务现场</text>
  <text x="74" y="88" text-anchor="middle" font-size="11" fill="#374151">看见角色和动作</text>
  <path d="M135 69 H146" stroke="#B45309" stroke-width="1.4" fill="none" marker-end="url(#f123a)"/>
  <rect x="149" y="30" width="116" height="78" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="207" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF">交接物</text>
  <text x="207" y="88" text-anchor="middle" font-size="11" fill="#374151">发现反复出现的东西</text>
  <path d="M268 69 H279" stroke="#B45309" stroke-width="1.4" fill="none" marker-end="url(#f123a)"/>
  <rect x="282" y="30" width="116" height="78" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="340" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF">异常和变化</text>
  <text x="340" y="88" text-anchor="middle" font-size="11" fill="#374151">看见对象之间的关系</text>
  <path d="M401 69 H412" stroke="#B45309" stroke-width="1.4" fill="none" marker-end="url(#f123a)"/>
  <rect x="415" y="30" width="116" height="78" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="473" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF">不同需求</text>
  <text x="473" y="88" text-anchor="middle" font-size="11" fill="#374151">找到不变的业务对象</text>
  <path d="M534 69 H545" stroke="#B45309" stroke-width="1.4" fill="none" marker-end="url(#f123a)"/>
  <rect x="548" y="30" width="116" height="78" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="606" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF">对象、关系</text>
  <text x="606" y="88" text-anchor="middle" font-size="11" fill="#374151">规则进入系统</text>
</svg>
