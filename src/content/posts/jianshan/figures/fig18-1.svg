<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" width="680" height="318" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 18-1　支持随任务推进的三个时点</title>
  <desc>支持要跟着任务走到当前这一步。上面一排是用户当时要做的事和他缺的东西，下面一排是可以安排的支持。一份完整的功能手册，哪一步都用不上。</desc>
  <rect width="680" height="318" fill="#ffffff"/>

  <rect x="25" y="40" width="190" height="74" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="120" cy="26" r="9.5" fill="#9CA3AF"/>
  <text x="120" y="26" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">1</text>
  <text x="120" y="68" text-anchor="middle" font-size="13" fill="#374151">确认安装条件</text>
  <text x="120" y="90" text-anchor="middle" font-size="11.5" fill="#6B7280">要知道怎样检查</text>

  <rect x="245" y="40" width="190" height="74" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="340" cy="26" r="9.5" fill="#9CA3AF"/>
  <text x="340" y="26" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">2</text>
  <text x="340" y="68" text-anchor="middle" font-size="13" fill="#374151">预约服务</text>
  <text x="340" y="90" text-anchor="middle" font-size="11.5" fill="#6B7280">缺的是一个方便的服务入口</text>

  <rect x="465" y="40" width="190" height="74" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="560" cy="26" r="9.5" fill="#9CA3AF"/>
  <text x="560" y="26" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">3</text>
  <text x="560" y="68" text-anchor="middle" font-size="13" fill="#374151">完成首次使用</text>
  <text x="560" y="90" text-anchor="middle" font-size="11.5" fill="#6B7280">要给针对具体操作的示范</text>

  <path d="M219 77 H241" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M237 73 L242 77 L237 81" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M439 77 H461" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M457 73 L462 77 L457 81" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>

  <path d="M120 118 V133" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M116 130 L120 137 L124 130" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M340 118 V133" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M336 130 L340 137 L344 130" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M560 118 V133" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M556 130 L560 137 L564 130" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>

  <rect x="25" y="142" width="190" height="64" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="120" y="168" text-anchor="middle" font-size="12.5" fill="#374151">一条清楚的</text>
  <text x="120" y="188" text-anchor="middle" font-size="12.5" fill="#374151">安装准备说明</text>

  <rect x="245" y="142" width="190" height="64" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="178" text-anchor="middle" font-size="12.5" fill="#374151">方便的服务入口</text>

  <rect x="465" y="142" width="190" height="64" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="560" y="178" text-anchor="middle" font-size="12.5" fill="#374151">针对具体操作的示范</text>

  <rect x="25" y="232" width="305" height="58" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="44" cy="261" r="8" fill="none" stroke="#B45309" stroke-width="1.2"/>
  <path d="M38.3 255.3 L49.7 266.7" stroke="#B45309" stroke-width="1.2" fill="none"/>
  <text x="187" y="258" text-anchor="middle" font-size="12.5" fill="#B45309">一份完整的功能手册</text>
  <text x="187" y="279" text-anchor="middle" font-size="12" fill="#B45309">并不一定比一条清楚的安装准备说明更有帮助</text>

  <rect x="350" y="232" width="305" height="58" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="369" cy="261" r="8" fill="none" stroke="#B45309" stroke-width="1.2"/>
  <path d="M363.3 255.3 L374.7 266.7" stroke="#B45309" stroke-width="1.2" fill="none"/>
  <text x="512" y="258" text-anchor="middle" font-size="12.5" fill="#B45309">设备本身存在故障</text>
  <text x="512" y="279" text-anchor="middle" font-size="12" fill="#B45309">继续推送教程只会增加负担</text>
</svg>
