<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 16-1　从行业存量到公司可承接的四层收窄</title>
  <desc>同一件事在不同层次上的口径并不一样。最外面是社会上存有多少旧手机，只是一个存量；往里一层是其中有多少会在一年内被机主拿出来处理；再往里是正在换机、愿意接受平台估价、能够被现有门店或合作网络覆盖的用户；最里面才是可以稳定兑现的交易。每一层都比上一层窄，落到公司时剩下的才是可以承接的范围。</desc>
  <rect width="680" height="250" fill="#ffffff"/>

  <rect x="60" y="30" width="560" height="42" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="56" text-anchor="middle" font-size="12.5" fill="#374151">社会上的旧机存量</text>

  <rect x="110" y="84" width="460" height="42" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="110" text-anchor="middle" font-size="12.5" fill="#374151">有多少会在一年内被机主拿出来处理</text>

  <rect x="160" y="138" width="360" height="42" rx="8" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="340" y="164" text-anchor="middle" font-size="12.5" fill="#374151">能够被现有门店或合作网络覆盖的用户</text>

  <rect x="210" y="192" width="260" height="42" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4"/>
  <text x="340" y="218" text-anchor="middle" font-size="12.5" fill="#B45309">可以稳定兑现的交易</text>

  <path d="M34 51 H52" stroke="#D1D5DB" stroke-width="1" fill="none"/>
  <path d="M34 105 H102" stroke="#D1D5DB" stroke-width="1" fill="none"/>
  <path d="M34 159 H152" stroke="#D1D5DB" stroke-width="1" fill="none"/>
  <path d="M34 213 H202" stroke="#B45309" stroke-width="1" fill="none"/>
  <path d="M34 45 V219" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
</svg>
