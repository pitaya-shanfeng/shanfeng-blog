<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" width="680" height="150" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 13-2　能力抽象的四个动作</title>
  <desc>从反复出现的动作开始识别重复，把已经稳定的部分抽成能力，给还在变化的部分留出位置，最后让被共同使用的公共能力知道边界在哪里。</desc>
  <defs>
    <marker id="f132a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="150" fill="#ffffff"/>
  <rect x="20" y="30" width="145" height="78" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="92" y="62" text-anchor="middle" font-size="10" fill="#9CA3AF">反复出现</text>
  <text x="92" y="86" text-anchor="middle" font-size="12" fill="#374151">识别重复</text>
  <path d="M168 69 H182" stroke="#B45309" stroke-width="1.4" fill="none" marker-end="url(#f132a)"/>
  <rect x="185" y="30" width="145" height="78" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="257" y="62" text-anchor="middle" font-size="10" fill="#9CA3AF">已经稳定</text>
  <text x="257" y="86" text-anchor="middle" font-size="12" fill="#374151">抽出能力</text>
  <path d="M333 69 H347" stroke="#B45309" stroke-width="1.4" fill="none" marker-end="url(#f132a)"/>
  <rect x="350" y="30" width="145" height="78" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="422" y="62" text-anchor="middle" font-size="10" fill="#9CA3AF">继续生长</text>
  <text x="422" y="86" text-anchor="middle" font-size="12" fill="#374151">保留变量</text>
  <path d="M498 69 H512" stroke="#B45309" stroke-width="1.4" fill="none" marker-end="url(#f132a)"/>
  <rect x="515" y="30" width="145" height="78" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="587" y="62" text-anchor="middle" font-size="10" fill="#9CA3AF">共同使用</text>
  <text x="587" y="86" text-anchor="middle" font-size="12" fill="#374151">纳入治理</text>
</svg>
