<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" width="680" height="318" role="img" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <title>图 10-1　怎么判断一个决策有没有发生</title>
  <desc>左边是两件不算数的事：会上点头、写进汇报；右边是三件算数的事：旧动作停下来、新资源压进去、关键角色担责。判断落在哪一侧，决定它只是原则同意，还是组织真的开始为新判断付成本。</desc>
  <defs>
    <marker id="f101a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="f101g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="180" y="30" font-size="12" fill="#6B7280" text-anchor="middle">不是看</text>
  <text x="500" y="30" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">而是看三件事</text>

  <rect x="40" y="40" width="280" height="46" rx="9" fill="#F3F5F7" stroke="#D1D5DB" stroke-width="1"/>
  <text x="180" y="69" font-size="15" fill="#6B7280" text-anchor="middle">会上有没有点头</text>
  <rect x="40" y="98" width="280" height="46" rx="9" fill="#F3F5F7" stroke="#D1D5DB" stroke-width="1"/>
  <text x="180" y="127" font-size="15" fill="#6B7280" text-anchor="middle">有没有写进汇报</text>
  <path d="M180 146 L180 168" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#f101g)"/>
  <rect x="40" y="172" width="280" height="54" rx="9" fill="#F3F5F7" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="180" y="205" font-size="14" fill="#6B7280" text-anchor="middle">很可能只是原则同意</text>

  <rect x="360" y="40" width="280" height="46" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="500" y="69" font-size="15" fill="#374151" text-anchor="middle">旧动作有没有停？</text>
  <rect x="360" y="98" width="280" height="46" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="500" y="127" font-size="15" fill="#374151" text-anchor="middle">新资源有没有压进去？</text>
  <rect x="360" y="156" width="280" height="46" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="500" y="185" font-size="14" fill="#374151" text-anchor="middle">关键角色有没有为新方向承担外部责任？</text>
  <path d="M500 204 L500 228" fill="none" stroke="#B45309" stroke-width="1.2" marker-end="url(#f101a)"/>
  <rect x="360" y="232" width="280" height="54" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
  <line x1="361.5" y1="236" x2="361.5" y2="282" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
  <text x="500" y="265" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">组织真的开始为新判断付成本</text>
</svg>
