<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="680" height="230" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 19-3　分头交付与共同经营之间的缺口</title>
  <desc>社群运营、品类运营、内容运营和活动运营各自完成交付，平台内部按部门拆开的工作最后都落到经销商面前，由他临时把几部分接起来。各团队都完成了自己的交付，经销商拿到的仍然是散的，原来没有解决的经营问题还留在几方职责的交界处。</desc>
  <defs>
    <marker id="f19c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="230" fill="#ffffff"/>

  <rect x="16" y="24" width="150" height="42" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="91" y="42" text-anchor="middle" font-size="12.5" fill="#374151">社群运营</text>
  <text x="91" y="58" text-anchor="middle" font-size="11" fill="#9CA3AF">清单·报表</text>

  <rect x="182" y="24" width="150" height="42" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="257" y="42" text-anchor="middle" font-size="12.5" fill="#374151">品类运营</text>
  <text x="257" y="58" text-anchor="middle" font-size="11" fill="#9CA3AF">选品·日历</text>

  <rect x="348" y="24" width="150" height="42" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="423" y="42" text-anchor="middle" font-size="12.5" fill="#374151">内容运营</text>
  <text x="423" y="58" text-anchor="middle" font-size="11" fill="#9CA3AF">图文·视频</text>

  <rect x="514" y="24" width="150" height="42" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="589" y="42" text-anchor="middle" font-size="12.5" fill="#374151">活动运营</text>
  <text x="589" y="58" text-anchor="middle" font-size="11" fill="#9CA3AF">营销资源</text>

  <path d="M91 66 V80" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <path d="M257 66 V80" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <path d="M423 66 V80" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <path d="M589 66 V80" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <path d="M91 80 H589" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M340 80 V92" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f19c)"/>

  <rect x="140" y="98" width="400" height="50" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="340" y="120" text-anchor="middle" font-size="12.5" fill="#374151">经销商面前</text>
  <text x="340" y="138" text-anchor="middle" font-size="11.5" fill="#9CA3AF">由他临时把几部分接起来</text>

  <path d="M340 148 V160" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f19c)"/>

  <rect x="140" y="166" width="400" height="48" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="170" cy="190" r="8" fill="none" stroke="#B45309" stroke-width="1.2"/>
  <path d="M164.3 184.3 L175.7 195.7" stroke="#B45309" stroke-width="1.2" fill="none"/>
  <text x="352" y="185" text-anchor="middle" font-size="12.5" fill="#B45309">各团队都完成了自己的交付</text>
  <text x="352" y="204" text-anchor="middle" font-size="12" fill="#B45309">经销商拿到的仍然是散的</text>
</svg>
