<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="680" height="180" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 19-2　评估材料如何在传递中变成承诺</title>
  <desc>一份价格方案本意是让业务看见涉及的范围与投入，随后被拿去对外同步、变成向合作方作出的承诺，最后落到完整落地。每转一手，可以退回讨论的余地就少一分，验证范围却没有跟着缩小。</desc>
  <defs>
    <marker id="f19b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="180" fill="#ffffff"/>

  <circle cx="86.5" cy="20" r="9.5" fill="#9CA3AF"/>
  <text x="86.5" y="20" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">1</text>
  <circle cx="255.5" cy="20" r="9.5" fill="#9CA3AF"/>
  <text x="255.5" y="20" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">2</text>
  <circle cx="424.5" cy="20" r="9.5" fill="#9CA3AF"/>
  <text x="424.5" y="20" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">3</text>
  <circle cx="593.5" cy="20" r="9.5" fill="#9CA3AF"/>
  <text x="593.5" y="20" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">4</text>

  <rect x="16" y="38" width="141" height="64" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="86.5" y="68" text-anchor="middle" font-size="12.5" fill="#374151">价格方案</text>
  <text x="86.5" y="90" text-anchor="middle" font-size="11" fill="#9CA3AF">本意看范围与投入</text>

  <path d="M157 70 H180" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f19b)"/>

  <rect x="185" y="38" width="141" height="64" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="255.5" y="68" text-anchor="middle" font-size="12.5" fill="#374151">产品改造思路</text>
  <text x="255.5" y="90" text-anchor="middle" font-size="11" fill="#9CA3AF">被拿去对外同步</text>

  <path d="M326 70 H349" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f19b)"/>

  <rect x="354" y="38" width="141" height="64" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="424.5" y="68" text-anchor="middle" font-size="12.5" fill="#374151">已成方案</text>
  <text x="424.5" y="90" text-anchor="middle" font-size="11" fill="#9CA3AF">向合作方承诺</text>

  <path d="M495 70 H518" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f19b)"/>

  <rect x="523" y="38" width="141" height="64" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="1.4"/>
  <text x="593.5" y="68" text-anchor="middle" font-size="12.5" fill="#B45309">完整落地</text>
  <text x="593.5" y="90" text-anchor="middle" font-size="11" fill="#9CA3AF">验证范围未缩</text>

  <rect x="16" y="118" width="648" height="46" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="44" cy="141" r="8" fill="none" stroke="#B45309" stroke-width="1.2"/>
  <path d="M38.3 135.3 L49.7 146.7" stroke="#B45309" stroke-width="1.2" fill="none"/>
  <text x="360" y="137" text-anchor="middle" font-size="12.5" fill="#B45309">方案越往后走，能改的余地越小</text>
  <text x="360" y="156" text-anchor="middle" font-size="12" fill="#B45309">剩下的选择主要是怎样实现</text>
</svg>
