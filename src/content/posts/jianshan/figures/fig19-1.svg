<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" width="680" height="210" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 19-1　三类项目要围绕不同的结果组织</title>
  <desc>同一个业务目标往下走，依据并不相同。创新型项目要取得证据，先回答假设是否成立；发展型项目要解除限制，先看瓶颈是否减轻；增长型项目要留下判断，留下可复制的依据。三者需要的角色相近，决定工作怎样展开的依据不同。</desc>
  <rect width="680" height="210" fill="#ffffff"/>

  <rect x="230" y="16" width="220" height="42" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="43" text-anchor="middle" font-size="13.5" fill="#374151">同一项业务目标</text>

  <path d="M340 58 V74" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M120 74 H560" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M120 74 V88" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M116 84 L120 95 L124 84" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M340 74 V88" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M336 84 L340 95 L344 84" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M560 74 V88" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M556 84 L560 95 L564 84" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>

  <rect x="30" y="98" width="180" height="88" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="120" y="126" text-anchor="middle" font-size="13.5" fill="#374151">创新型项目</text>
  <text x="120" y="152" text-anchor="middle" font-size="12.5" fill="#B45309">要取得证据</text>
  <text x="120" y="172" text-anchor="middle" font-size="11.5" fill="#9CA3AF">假设是否成立</text>

  <rect x="250" y="98" width="180" height="88" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="126" text-anchor="middle" font-size="13.5" fill="#374151">发展型项目</text>
  <text x="340" y="152" text-anchor="middle" font-size="12.5" fill="#B45309">要解除限制</text>
  <text x="340" y="172" text-anchor="middle" font-size="11.5" fill="#9CA3AF">瓶颈是否减轻</text>

  <rect x="470" y="98" width="180" height="88" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="560" y="126" text-anchor="middle" font-size="13.5" fill="#374151">增长型项目</text>
  <text x="560" y="152" text-anchor="middle" font-size="12.5" fill="#B45309">要留下判断</text>
  <text x="560" y="172" text-anchor="middle" font-size="11.5" fill="#9CA3AF">可复制的依据</text>
</svg>
