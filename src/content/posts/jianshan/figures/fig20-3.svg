<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 162" width="680" height="162" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 20-3　虚拟项目的四个边界条件</title>
  <desc>虚拟项目要守住四条边界：要解决的问题清楚，owner 在项目内的决策权清楚，各领域仍由对应成员提供判断，项目结束后能力与责任回到明确领域。守住这四条，虚拟项目才不会破坏稳定分工，也不会长期停在临时协作的状态。</desc>
  <rect width="680" height="162" fill="#ffffff"/>

  <rect x="240" y="16" width="200" height="38" rx="8" fill="#B45309" stroke="#92400E" stroke-width="1"/>
  <text x="340" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">虚拟项目</text>

  <path d="M340 54 V70" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M100 70 H580" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M100 70 V86" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M258 70 V86" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M421 70 V86" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M584 70 V86" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>

  <rect x="18" y="86" width="155" height="48" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="95" y="115" text-anchor="middle" font-size="11" fill="#374151">① 要解决什么问题清楚</text>

  <rect x="181" y="86" width="155" height="48" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="258" y="115" text-anchor="middle" font-size="11" fill="#374151">② owner 有明确决策权</text>

  <rect x="344" y="86" width="155" height="48" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="421" y="115" text-anchor="middle" font-size="11" fill="#374151">③ 各领域仍提供判断</text>

  <rect x="507" y="86" width="155" height="48" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="584" y="115" text-anchor="middle" font-size="11" fill="#374151">④ 结束回到明确领域</text>
</svg>
