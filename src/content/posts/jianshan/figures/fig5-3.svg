<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<title>图 5-3　阶段决定权重</title>
<rect x="20.0" y="40.0" width="200.0" height="200.0" rx="10" fill="#FCFCFA" stroke="#E6E3DB"/>
<rect x="20.0" y="40.0" width="200.0" height="34" rx="10" fill="#EAF2EE"/>
<rect x="20.0" y="64.0" width="200.0" height="10" fill="#EAF2EE"/>
<text x="120.0" y="62.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F5F4A">产品早期</text>
<text x="120.0" y="102.0" text-anchor="middle" font-size="9.5" fill="#9A9A90">该证明什么</text>
<text x="120.0" y="124.0" text-anchor="middle" font-size="11.5" fill="#2C2C2A">用户为什么需要你</text>
<line x1="36.0" y1="148.0" x2="204.0" y2="148.0" stroke="#EDEBE4"/>
<text x="120.0" y="172.0" text-anchor="middle" font-size="9.5" fill="#9A9A90">权重更高的是</text>
<text x="120.0" y="194.0" text-anchor="middle" font-size="11.5" fill="#1F5F4A">用户任务、核心体验</text>
<rect x="240.0" y="40.0" width="200.0" height="200.0" rx="10" fill="#FCFCFA" stroke="#E6E3DB"/>
<rect x="240.0" y="40.0" width="200.0" height="34" rx="10" fill="#EAF2EE"/>
<rect x="240.0" y="64.0" width="200.0" height="10" fill="#EAF2EE"/>
<text x="340.0" y="62.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F5F4A">稳定增长期</text>
<text x="340.0" y="102.0" text-anchor="middle" font-size="9.5" fill="#9A9A90">该证明什么</text>
<text x="340.0" y="124.0" text-anchor="middle" font-size="11.5" fill="#2C2C2A">凭什么继续存在</text>
<line x1="256.0" y1="148.0" x2="424.0" y2="148.0" stroke="#EDEBE4"/>
<text x="340.0" y="172.0" text-anchor="middle" font-size="9.5" fill="#9A9A90">权重更高的是</text>
<text x="340.0" y="194.0" text-anchor="middle" font-size="11.5" fill="#1F5F4A">商业结构、成本边界</text>
<rect x="460.0" y="40.0" width="200.0" height="200.0" rx="10" fill="#FCFCFA" stroke="#E6E3DB"/>
<rect x="460.0" y="40.0" width="200.0" height="34" rx="10" fill="#EAF2EE"/>
<rect x="460.0" y="64.0" width="200.0" height="10" fill="#EAF2EE"/>
<text x="560.0" y="62.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F5F4A">复杂系统阶段</text>
<text x="560.0" y="102.0" text-anchor="middle" font-size="9.5" fill="#9A9A90">该证明什么</text>
<text x="560.0" y="124.0" text-anchor="middle" font-size="11.5" fill="#2C2C2A">整体代价是否可控</text>
<line x1="476.0" y1="148.0" x2="644.0" y2="148.0" stroke="#EDEBE4"/>
<text x="560.0" y="172.0" text-anchor="middle" font-size="9.5" fill="#9A9A90">权重更高的是</text>
<text x="560.0" y="194.0" text-anchor="middle" font-size="11.5" fill="#1F5F4A">技术约束、组织协同</text>
<line x1="223.0" y1="140.0" x2="237.0" y2="140.0" stroke="#C9C6BC" stroke-width="1.2"/>
<path d="M 237.0 140.0 L 233.0 136.6 L 233.0 143.4 Z" fill="#C9C6BC"/>
<line x1="443.0" y1="140.0" x2="457.0" y2="140.0" stroke="#C9C6BC" stroke-width="1.2"/>
<path d="M 457.0 140.0 L 453.0 136.6 L 453.0 143.4 Z" fill="#C9C6BC"/>
<text x="340" y="272" text-anchor="middle" font-size="11" fill="#9A9A90">阶段变了，同一个问题的正确答案也会跟着变</text>
