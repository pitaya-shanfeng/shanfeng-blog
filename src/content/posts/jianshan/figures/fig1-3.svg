<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" role="img" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <title>图 1-3　能力嵌套的三个层次</title>
  <desc>P9 定义价值，判断方向值不值得投入；P8 定义问题，找出真正需要解决的问题；P7 把需求做对，在给定资源内找到最优解。外层包含内层，构成能力嵌套。</desc>

  <rect x="40" y="40" width="600" height="250" rx="16" fill="#EEF0F3" stroke="#9CA3AF" stroke-width="1"/>
  <text x="64" y="68" font-size="13" font-weight="500" fill="#1F2937">P9　定义价值</text>
  <text x="64" y="88" font-size="11" fill="#4B5563">判断这个方向本身值不值得投入</text>

  <rect x="80" y="96" width="520" height="168" rx="12" fill="#F7F8FA" stroke="#B4B2A9" stroke-width="1"/>
  <text x="104" y="124" font-size="13" font-weight="500" fill="#1F2937">P8　定义问题</text>
  <text x="104" y="144" font-size="11" fill="#4B5563">给一个模糊方向，找出真正需要解决的问题</text>

  <rect x="120" y="152" width="440" height="86" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="144" y="190" font-size="13" font-weight="500" fill="#1F2937">P7　把需求做对</text>
  <text x="144" y="210" font-size="11" fill="#4B5563">给一个明确问题，在给定资源内找到最优解</text>
</svg>
