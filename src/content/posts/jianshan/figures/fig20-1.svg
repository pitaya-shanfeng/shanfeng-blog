<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 172" width="680" height="172" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 20-1　能力链：判断怎样从个人走向团队</title>
  <desc>五环从左到右，各解一类问题、各留一项能力；链条越往右，越不依赖某个人。先定方向让目标一致，稳定领域让经验沉淀，决策授权让责任能够落地，项目协同让专业分工形成结果，能力接续让经验离开个人。</desc>
  <rect width="680" height="172" fill="#ffffff"/>

  <rect x="18" y="26" width="116" height="58" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="76" y="60" text-anchor="middle" font-size="13" fill="#374151">先定方向</text>

  <rect x="150" y="26" width="116" height="58" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="208" y="60" text-anchor="middle" font-size="13" fill="#374151">稳定领域</text>

  <rect x="282" y="26" width="116" height="58" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="60" text-anchor="middle" font-size="13" fill="#374151">决策授权</text>

  <rect x="414" y="26" width="116" height="58" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="472" y="60" text-anchor="middle" font-size="13" fill="#374151">项目协同</text>

  <rect x="546" y="26" width="116" height="58" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="604" y="60" text-anchor="middle" font-size="13" fill="#374151">能力接续</text>

  <path d="M134 55 H144" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M141 52 L146 55 L141 58" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M266 55 H276" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M273 52 L278 55 L273 58" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M398 55 H408" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M405 52 L410 55 L405 58" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M530 55 H540" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M537 52 L542 55 L537 58" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>

  <text x="76" y="112" text-anchor="middle" font-size="10.5" fill="#6B7280">大家为什么投入</text>
  <text x="76" y="132" text-anchor="middle" font-size="10.5" fill="#B45309">留下：一致方向</text>

  <text x="208" y="112" text-anchor="middle" font-size="10.5" fill="#6B7280">经验在哪积累</text>
  <text x="208" y="132" text-anchor="middle" font-size="10.5" fill="#B45309">留下：专业深度</text>

  <text x="340" y="112" text-anchor="middle" font-size="10.5" fill="#6B7280">谁能据事实行动</text>
  <text x="340" y="132" text-anchor="middle" font-size="10.5" fill="#B45309">留下：决策能力</text>

  <text x="472" y="112" text-anchor="middle" font-size="10.5" fill="#6B7280">领域怎样成结果</text>
  <text x="472" y="132" text-anchor="middle" font-size="10.5" fill="#B45309">留下：整体意识</text>

  <text x="604" y="112" text-anchor="middle" font-size="10.5" fill="#6B7280">经验离开个人</text>
  <text x="604" y="132" text-anchor="middle" font-size="10.5" fill="#B45309">留下：团队能力</text>

  <path d="M18 152 H662" stroke="#E5E7EB" stroke-width="1" fill="none"/>
  <text x="340" y="166" text-anchor="middle" font-size="10.5" fill="#9CA3AF">判断从一个人手里，走到团队手里</text>
</svg>
