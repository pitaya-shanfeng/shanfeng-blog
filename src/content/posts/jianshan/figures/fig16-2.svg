<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 208" width="680" height="208" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 16-2　盒马邻里：从扩张到停止自提</title>
  <desc>盒马邻里从 2021 年推出，随后进入北京、广州、深圳、武汉、西安等多个城市，门店和自提点也在较短时间里铺开。2021 年底，广州、深圳、苏州等地的业务开始调整；2022 年又陆续退出北京、西安、成都、武汉、杭州和南京，经营范围收缩到上海。上海的自提业务继续运行了一段时间，到 2025 年 10 月停止自提及相关业务。</desc>
  <defs>
    <marker id="f16b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="208" fill="#ffffff"/>

  <path d="M62 56 H600" stroke="#E5E7EB" stroke-width="1.2" fill="none"/>
  <path d="M600 56 H616" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f16b)"/>

  <circle cx="85" cy="56" r="4.5" fill="#D1D5DB"/>
  <circle cx="250" cy="56" r="4.5" fill="#D1D5DB"/>
  <circle cx="415" cy="56" r="4.5" fill="#D1D5DB"/>
  <circle cx="590" cy="56" r="4.5" fill="#B45309"/>

  <path d="M85 62 V80" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <path d="M250 62 V80" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <path d="M415 62 V80" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <path d="M590 62 V80" stroke="#B45309" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

  <rect x="10" y="80" width="150" height="100" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="85" y="102" text-anchor="middle" font-size="12" fill="#B45309">2021 年</text>
  <text x="85" y="126" text-anchor="middle" font-size="11.5" fill="#374151">盒马推出盒马邻里</text>
  <text x="85" y="146" text-anchor="middle" font-size="11.5" fill="#374151">进入多个城市</text>
  <text x="85" y="166" text-anchor="middle" font-size="11.5" fill="#374151">门店和自提点</text>

  <rect x="175" y="80" width="150" height="100" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="250" y="102" text-anchor="middle" font-size="12" fill="#374151">2021 年底</text>
  <text x="250" y="126" text-anchor="middle" font-size="11.5" fill="#374151">广州、深圳、苏州</text>
  <text x="250" y="146" text-anchor="middle" font-size="11.5" fill="#374151">等地的业务</text>
  <text x="250" y="166" text-anchor="middle" font-size="11.5" fill="#374151">开始调整</text>

  <rect x="340" y="80" width="150" height="100" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="415" y="102" text-anchor="middle" font-size="12" fill="#374151">2022 年</text>
  <text x="415" y="126" text-anchor="middle" font-size="11.5" fill="#374151">陆续退出北京、西安</text>
  <text x="415" y="146" text-anchor="middle" font-size="11.5" fill="#374151">成都、武汉、杭州和南京</text>
  <text x="415" y="166" text-anchor="middle" font-size="11.5" fill="#374151">经营范围收缩到上海</text>

  <rect x="515" y="80" width="150" height="100" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4"/>
  <text x="590" y="102" text-anchor="middle" font-size="12" fill="#B45309">2025 年 10 月</text>
  <text x="590" y="126" text-anchor="middle" font-size="11.5" fill="#374151">上海的自提业务</text>
  <text x="590" y="146" text-anchor="middle" font-size="11.5" fill="#374151">继续运行了一段时间</text>
  <text x="590" y="166" text-anchor="middle" font-size="11.5" fill="#374151">停止自提及相关业务</text>
</svg>
