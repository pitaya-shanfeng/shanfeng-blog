<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 252" width="680" height="252" role="img" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <title>图 1-2　经验负债是怎么形成的</title>
  <desc>经验积累形成认知滤镜，遇到新问题时直接套用旧框架，导致判断失误，经验由此变成负债。</desc>
  <defs>
    <marker id="f12ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="f12ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="132" height="100" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="106" y="70" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle">经验积累</text>
  <text x="106" y="100" font-size="11" fill="#6B7280" text-anchor="middle">成功方法</text>
  <text x="106" y="118" font-size="11" fill="#6B7280" text-anchor="middle">反复验证</text>

  <path d="M176 90 L190 90" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f12ar)"/>

  <rect x="196" y="40" width="132" height="100" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="262" y="70" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle">认知滤镜</text>
  <text x="262" y="100" font-size="11" fill="#6B7280" text-anchor="middle">问题被映射到</text>
  <text x="262" y="118" font-size="11" fill="#6B7280" text-anchor="middle">擅长的解法</text>

  <path d="M332 90 L346 90" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f12ar)"/>

  <rect x="352" y="40" width="132" height="100" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="418" y="70" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle">直接套用</text>
  <text x="418" y="100" font-size="11" fill="#6B7280" text-anchor="middle">旧框架套新问题</text>
  <text x="418" y="118" font-size="11" fill="#6B7280" text-anchor="middle">跳过重新理解</text>

  <path d="M488 90 L502 90" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f12ar)"/>

  <rect x="508" y="40" width="132" height="100" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="574" y="70" font-size="13" font-weight="500" fill="#1F2937" text-anchor="middle">判断失误</text>
  <text x="574" y="100" font-size="11" fill="#6B7280" text-anchor="middle">有效前提已变</text>
  <text x="574" y="118" font-size="11" fill="#6B7280" text-anchor="middle">方案随之失效</text>

  <path d="M340 140 L340 164" fill="none" stroke="#B45309" stroke-width="1" marker-end="url(#f12ar2)"/>

  <rect x="40" y="170" width="600" height="62" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
  <text x="340" y="196" font-size="13.5" font-weight="500" fill="#7C2D12" text-anchor="middle">经验从帮你理解世界，变成替代你理解世界</text>
  <text x="340" y="216" font-size="11.5" fill="#92400E" text-anchor="middle">同一个前提被反复套用，经验负债就此形成</text>
</svg>
