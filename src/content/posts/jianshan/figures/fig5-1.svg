<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" width="680" height="292" role="img" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<title>图 5-1　五种视角各自只能看见一部分</title>
<rect x="22.0" y="40" width="120.8" height="208" rx="10" fill="#FCFCFA" stroke="#E6E3DB"/>
<rect x="22.0" y="40" width="120.8" height="34" rx="10" fill="#EAF2EE"/>
<rect x="22.0" y="64" width="120.8" height="10" fill="#EAF2EE"/>
<text x="82.4" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F5F4A">用户视角</text>
<text x="82.4" y="104" text-anchor="middle" font-size="9.5" fill="#9A9A90">它能提醒你</text>
<text x="82.4" y="124" text-anchor="middle" font-size="11.5" fill="#2C2C2A">体验会被伤害</text>
<line x1="36.0" y1="156" x2="128.8" y2="156" stroke="#EDEBE4"/>
<text x="82.4" y="184" text-anchor="middle" font-size="9.5" fill="#9A9A90">它看不见</text>
<text x="82.4" y="204" text-anchor="middle" font-size="11.5" fill="#8A8378">成本结构</text>
<rect x="150.8" y="40" width="120.8" height="208" rx="10" fill="#FCFCFA" stroke="#E6E3DB"/>
<rect x="150.8" y="40" width="120.8" height="34" rx="10" fill="#EAF2EE"/>
<rect x="150.8" y="64" width="120.8" height="10" fill="#EAF2EE"/>
<text x="211.2" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F5F4A">商业视角</text>
<text x="211.2" y="104" text-anchor="middle" font-size="9.5" fill="#9A9A90">它能提醒你</text>
<text x="211.2" y="124" text-anchor="middle" font-size="11.5" fill="#2C2C2A">收入和效率</text>
<line x1="164.8" y1="156" x2="257.6" y2="156" stroke="#EDEBE4"/>
<text x="211.2" y="184" text-anchor="middle" font-size="9.5" fill="#9A9A90">它看不见</text>
<text x="211.2" y="204" text-anchor="middle" font-size="11.5" fill="#8A8378">信任被透支的代价</text>
<rect x="279.6" y="40" width="120.8" height="208" rx="10" fill="#FCFCFA" stroke="#E6E3DB"/>
<rect x="279.6" y="40" width="120.8" height="34" rx="10" fill="#EAF2EE"/>
<rect x="279.6" y="64" width="120.8" height="10" fill="#EAF2EE"/>
<text x="340.0" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F5F4A">技术视角</text>
<text x="340.0" y="104" text-anchor="middle" font-size="9.5" fill="#9A9A90">它能提醒你</text>
<text x="340.0" y="124" text-anchor="middle" font-size="11.5" fill="#2C2C2A">系统不能失控</text>
<line x1="293.6" y1="156" x2="386.4" y2="156" stroke="#EDEBE4"/>
<text x="340.0" y="184" text-anchor="middle" font-size="9.5" fill="#9A9A90">它看不见</text>
<text x="340.0" y="204" text-anchor="middle" font-size="11.5" fill="#8A8378">真实现场的复杂度</text>
<rect x="408.4" y="40" width="120.8" height="208" rx="10" fill="#FCFCFA" stroke="#E6E3DB"/>
<rect x="408.4" y="40" width="120.8" height="34" rx="10" fill="#EAF2EE"/>
<rect x="408.4" y="64" width="120.8" height="10" fill="#EAF2EE"/>
<text x="468.8" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F5F4A">体验视角</text>
<text x="468.8" y="104" text-anchor="middle" font-size="9.5" fill="#9A9A90">它能提醒你</text>
<text x="468.8" y="124" text-anchor="middle" font-size="11.5" fill="#2C2C2A">用户的感受</text>
<line x1="422.4" y1="156" x2="515.2" y2="156" stroke="#EDEBE4"/>
<text x="468.8" y="184" text-anchor="middle" font-size="9.5" fill="#9A9A90">它看不见</text>
<text x="468.8" y="204" text-anchor="middle" font-size="11.5" fill="#8A8378">边界与异常路径</text>
<rect x="537.2" y="40" width="120.8" height="208" rx="10" fill="#FCFCFA" stroke="#E6E3DB"/>
<rect x="537.2" y="40" width="120.8" height="34" rx="10" fill="#EAF2EE"/>
<rect x="537.2" y="64" width="120.8" height="10" fill="#EAF2EE"/>
<text x="597.6" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F5F4A">组织视角</text>
<text x="597.6" y="104" text-anchor="middle" font-size="9.5" fill="#9A9A90">它能提醒你</text>
<text x="597.6" y="124" text-anchor="middle" font-size="11.5" fill="#2C2C2A">眼前的窗口期</text>
<line x1="551.2" y1="156" x2="644.0" y2="156" stroke="#EDEBE4"/>
<text x="597.6" y="184" text-anchor="middle" font-size="9.5" fill="#9A9A90">它看不见</text>
<text x="597.6" y="204" text-anchor="middle" font-size="11.5" fill="#8A8378">焦虑被当成战略</text>
<text x="340" y="274" text-anchor="middle" font-size="11" fill="#9A9A90">每一种视角都能指出真问题，也都会漏掉一部分真问题</text>
</svg>