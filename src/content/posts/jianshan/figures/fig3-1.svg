<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 284" width="680" height="284" role="img" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <title>图 3-1　数据位置与问题位置的分离</title>
  <desc>数据发生在哪里，问题未必就在哪里。往前看用户来到这里之前，往后看用户离开之后，再往外看商品、价格、履约、供给、规则或组织流程。</desc>
  <defs>
    <marker id="f31ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="180" y="16" width="320" height="58" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="340" y="37" font-size="11" fill="#6B7280" text-anchor="middle" dominant-baseline="central">问题位置</text>
  <text x="340" y="59" font-size="12" fill="#374151" text-anchor="middle" dominant-baseline="central">商品、价格、履约、供给、规则、组织流程</text>

  <path d="M340 74 L340 100" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f31ar)"/>
  <text x="352" y="87" font-size="11" fill="#6B7280" dominant-baseline="central">再往外看</text>

  <rect x="32" y="104" width="150" height="52" rx="8" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="107" y="130" font-size="13" fill="#1F2937" text-anchor="middle" dominant-baseline="central">用户来到这里之前</text>

  <path d="M182 130 L244 130" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f31ar)"/>

  <rect x="248" y="104" width="184" height="52" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
  <text x="340" y="130" font-size="14" font-weight="500" fill="#B45309" text-anchor="middle" dominant-baseline="central">数据位置</text>

  <path d="M432 130 L494 130" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f31ar)"/>

  <rect x="498" y="104" width="150" height="52" rx="8" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="573" y="130" font-size="13" fill="#1F2937" text-anchor="middle" dominant-baseline="central">用户离开之后</text>

  <text x="107" y="180" font-size="11" fill="#6B7280" text-anchor="middle">往前看</text>
  <text x="573" y="180" font-size="11" fill="#6B7280" text-anchor="middle">往后看</text>

  <path d="M32 214 L648 214" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="244" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="central">数据发生在哪里，问题未必就在哪里</text>
</svg>
