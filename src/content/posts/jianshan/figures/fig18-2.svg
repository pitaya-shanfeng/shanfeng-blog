<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 278" width="680" height="278" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 18-2　一次触达从依据到发出的判断链</title>
  <desc>一条触达要依次经过依据、内容、渠道、频次和发出前的判断。上面一排是五个环节，下面一排是每个环节要回答的问题。缺了任何一步，触达都会变成打扰。</desc>
  <rect width="680" height="278" fill="#ffffff"/>

  <circle cx="80" cy="26" r="9.5" fill="#9CA3AF"/>
  <text x="80" y="26" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">1</text>
  <circle cx="210" cy="26" r="9.5" fill="#9CA3AF"/>
  <text x="210" y="26" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">2</text>
  <circle cx="340" cy="26" r="9.5" fill="#9CA3AF"/>
  <text x="340" y="26" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">3</text>
  <circle cx="470" cy="26" r="9.5" fill="#9CA3AF"/>
  <text x="470" y="26" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">4</text>
  <circle cx="600" cy="26" r="9.5" fill="#9CA3AF"/>
  <text x="600" y="26" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFFFFF">5</text>

  <rect x="25" y="42" width="110" height="62" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="78" text-anchor="middle" font-size="13" fill="#374151">依据</text>
  <rect x="155" y="42" width="110" height="62" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="210" y="78" text-anchor="middle" font-size="13" fill="#374151">内容</text>
  <rect x="285" y="42" width="110" height="62" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="78" text-anchor="middle" font-size="13" fill="#374151">渠道</text>
  <rect x="415" y="42" width="110" height="62" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="470" y="78" text-anchor="middle" font-size="13" fill="#374151">频次</text>
  <rect x="545" y="42" width="110" height="62" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="600" y="78" text-anchor="middle" font-size="13" fill="#374151">发出前</text>

  <path d="M137 73 H151" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M147 69 L152 73 L147 77" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M267 73 H281" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M277 69 L282 73 L277 77" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M397 73 H411" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M407 69 L412 73 L407 77" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M527 73 H541" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M537 69 L542 73 L537 77" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>

  <path d="M80 108 V114" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M76 111 L80 118 L84 111" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M210 108 V114" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M206 111 L210 118 L214 111" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M340 108 V114" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M336 111 L340 118 L344 111" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M470 108 V114" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M466 111 L470 118 L474 111" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M600 108 V114" stroke="#D1D5DB" stroke-width="1.2" fill="none"/>
  <path d="M596 111 L600 118 L604 111" stroke="#D1D5DB" stroke-width="1.2" fill="none" stroke-linejoin="round"/>

  <rect x="25" y="122" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="153" text-anchor="middle" font-size="11.5" fill="#374151">什么时候联系</text>
  <rect x="155" y="122" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="210" y="153" text-anchor="middle" font-size="11.5" fill="#374151">此刻说什么</text>
  <rect x="285" y="122" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="340" y="153" text-anchor="middle" font-size="11.5" fill="#374151">放在哪里</text>
  <rect x="415" y="122" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="470" y="153" text-anchor="middle" font-size="11.5" fill="#374151">多久一次</text>
  <rect x="545" y="122" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="600" y="153" text-anchor="middle" font-size="11.5" fill="#374151">还要不要发</text>

  <rect x="25" y="196" width="305" height="58" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="44" cy="225" r="8" fill="none" stroke="#B45309" stroke-width="1.2"/>
  <path d="M38.3 219.3 L49.7 230.7" stroke="#B45309" stroke-width="1.2" fill="none"/>
  <text x="187" y="222" text-anchor="middle" font-size="12.5" fill="#B45309">更强的打断能力</text>
  <text x="187" y="243" text-anchor="middle" font-size="12" fill="#B45309">不等于更好的运营能力</text>

  <rect x="350" y="196" width="305" height="58" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="369" cy="225" r="8" fill="none" stroke="#B45309" stroke-width="1.2"/>
  <path d="M363.3 219.3 L374.7 230.7" stroke="#B45309" stroke-width="1.2" fill="none"/>
  <text x="512" y="222" text-anchor="middle" font-size="12.5" fill="#B45309">用用户的不确定性</text>
  <text x="512" y="243" text-anchor="middle" font-size="12" fill="#B45309">换来一次点击</text>
</svg>
