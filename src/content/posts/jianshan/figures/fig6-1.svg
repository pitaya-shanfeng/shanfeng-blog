<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 120" width="680" height="120" role="img" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <title>图 6-1　问题定义五步法</title>
  <desc>看见现象、暂停方案、还原任务、定义代价、锁定改变五个动作依次推进：把现象看完整，问原方案解释不了什么，把行为拆回任务，把问题翻译成可以回应的事，最后明确要改变的最小结果。图给的是这五步各自的顺序与转换关系；每一步的判断错了会看到什么信号，另在正文的表格里逐条列出。</desc>
  <defs>
    <marker id="f61ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="11" y="8" width="658" height="104" rx="12" fill="none" stroke="#B45309" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="21" y="16" width="110" height="88" rx="10" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="76" y="42" font-size="13.5" font-weight="500" fill="#1F2937" text-anchor="middle">看见现象</text>
  <text x="76" y="70" font-size="11" fill="#4B5563" text-anchor="middle">把现象</text>
  <text x="76" y="88" font-size="11" fill="#4B5563" text-anchor="middle">看完整</text>

  <path d="M131 60 L145 60" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f61ar)"/>

  <rect x="153" y="16" width="110" height="88" rx="10" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="208" y="42" font-size="13.5" font-weight="500" fill="#1F2937" text-anchor="middle">暂停方案</text>
  <text x="208" y="70" font-size="11" fill="#4B5563" text-anchor="middle">问原方案</text>
  <text x="208" y="88" font-size="11" fill="#4B5563" text-anchor="middle">解释不了什么</text>

  <path d="M263 60 L277 60" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f61ar)"/>

  <rect x="285" y="16" width="110" height="88" rx="10" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="340" y="42" font-size="13.5" font-weight="500" fill="#1F2937" text-anchor="middle">还原任务</text>
  <text x="340" y="70" font-size="11" fill="#4B5563" text-anchor="middle">把行为</text>
  <text x="340" y="88" font-size="11" fill="#4B5563" text-anchor="middle">拆回任务</text>

  <path d="M395 60 L409 60" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f61ar)"/>

  <rect x="417" y="16" width="110" height="88" rx="10" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="472" y="42" font-size="13.5" font-weight="500" fill="#1F2937" text-anchor="middle">定义代价</text>
  <text x="472" y="70" font-size="11" fill="#4B5563" text-anchor="middle">把问题翻译成</text>
  <text x="472" y="88" font-size="11" fill="#4B5563" text-anchor="middle">可以回应的事</text>

  <path d="M527 60 L541 60" fill="none" stroke="#9CA3AF" stroke-width="1" marker-end="url(#f61ar)"/>

  <rect x="549" y="16" width="110" height="88" rx="10" fill="#F7F8FA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="604" y="42" font-size="13.5" font-weight="500" fill="#1F2937" text-anchor="middle">锁定改变</text>
  <text x="604" y="70" font-size="11" fill="#4B5563" text-anchor="middle">明确要改变的</text>
  <text x="604" y="88" font-size="11" fill="#4B5563" text-anchor="middle">最小结果</text>
</svg>
