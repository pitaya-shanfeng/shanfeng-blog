<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>图 14-1　两种业务要走的链路不一样</title>
  <desc>面向消费者的业务，货从中心仓发出，经快递送到个人手里；面向连锁门店的业务，货要先进入区域中心仓，调拨到合作方区域仓，再分拨到各地前置仓，最后由城配网络送到门店。两条链路都在送货，中间经手的环节却不一样多。</desc>
  <defs>
    <marker id="f142a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="f142b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="200" fill="#ffffff"/>
  <text x="149" y="28" font-size="10.5" fill="#9CA3AF">消费者</text>
  <rect x="149" y="38" width="110" height="46" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="204" y="66" text-anchor="middle" font-size="12.5" fill="#6B7280">中心仓</text>
  <path d="M261 61 H302" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f142a)"/>
  <rect x="305" y="38" width="90" height="46" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="350" y="66" text-anchor="middle" font-size="12.5" fill="#6B7280">快递</text>
  <path d="M397 61 H438" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#f142a)"/>
  <rect x="441" y="38" width="90" height="46" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="486" y="66" text-anchor="middle" font-size="12.5" fill="#6B7280">个人</text>
  <path d="M40 100 H640" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
  <text x="65" y="124" font-size="10.5" fill="#B45309">连锁门店</text>
  <rect x="65" y="134" width="110" height="46" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
  <text x="120" y="162" text-anchor="middle" font-size="12" fill="#374151">区域中心仓</text>
  <path d="M177 157 H213" stroke="#B45309" stroke-width="1.3" fill="none" marker-end="url(#f142b)"/>
  <rect x="215" y="134" width="120" height="46" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
  <text x="275" y="162" text-anchor="middle" font-size="12" fill="#374151">合作方区域仓</text>
  <path d="M337 157 H373" stroke="#B45309" stroke-width="1.3" fill="none" marker-end="url(#f142b)"/>
  <rect x="375" y="134" width="110" height="46" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
  <text x="430" y="162" text-anchor="middle" font-size="12" fill="#374151">各地前置仓</text>
  <path d="M487 157 H523" stroke="#B45309" stroke-width="1.3" fill="none" marker-end="url(#f142b)"/>
  <rect x="525" y="134" width="90" height="46" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/>
  <text x="570" y="162" text-anchor="middle" font-size="12" fill="#374151">门店</text>
</svg>
